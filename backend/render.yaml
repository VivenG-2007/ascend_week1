services:
  - type: web
    name: campusvoice-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    region: singapore          # pick the region closest to your Supabase/Azure resources
    plan: starter              # upgrade to standard for persistent disk
    healthCheckPath: /health
    envVars:
      # ── Core ───────────────────────────────────────────────────────────────
      - key: APP_ENV
        value: production
      - key: COLLEGE_NAME
        sync: false            # set in Render dashboard
      - key: FRONTEND_ORIGIN
        sync: false            # e.g. https://campusvoice.vercel.app  (no trailing slash)
      - key: DATABASE_URL
        sync: false            # postgresql://USER:PASS@HOST:5432/postgres (Supabase pooler URL)
      - key: LOG_LEVEL
        value: DEBUG           # DEBUG prints every service call; change to INFO in steady state

      # ── Chroma Cloud (api.trychroma.com) ───────────────────────────────────
      # Get from: https://cloud.trychroma.com → database → "Connect"
      - key: CHROMA_API_KEY
        sync: false            # ck-...
      - key: CHROMA_TENANT
        sync: false            # UUID from Chroma Cloud dashboard
      - key: CHROMA_DATABASE
        sync: false            # database name you created in Chroma Cloud
      - key: CHROMA_COLLECTION_NAME
        value: campusvoice_chunks
      - key: SIMILARITY_THRESHOLD
        value: "0.55"
      - key: AUTO_REINDEX
        value: "true"

      # ── Azure AI Foundry — Text Embeddings ─────────────────────────────────
      - key: EMBEDDING_PROVIDER
        value: azure
      - key: AZURE_EMBEDDING_DEPLOYMENT
        sync: false            # e.g. text-embedding-3-large
      - key: AZURE_EMBEDDING_DIMENSION
        value: "1536"

      # ── Documents / OCR / Storage ──────────────────────────────────────────
      - key: MAX_UPLOAD_MB
        value: "15"
      - key: OCR_PROVIDER
        value: azure
      - key: AZURE_DOCUMENT_INTELLIGENCE_ENDPOINT
        sync: false            # https://<resource>.cognitiveservices.azure.com/
      - key: AZURE_DOCUMENT_INTELLIGENCE_KEY
        sync: false

      # ── Supabase — PostgreSQL + Object Storage ─────────────────────────────
      - key: SUPABASE_URL
        sync: false            # https://<project>.supabase.co
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false            # backend only — NEVER expose to frontend
      - key: SUPABASE_STORAGE_BUCKET
        value: campusvoice-documents

      # ── Azure AI Foundry — LLM (GPT-4o) ───────────────────────────────────
      - key: AGENT_MODE
        value: auto
      - key: AZURE_AI_FOUNDRY_ENDPOINT
        sync: false            # https://<resource>.openai.azure.com/
      - key: AZURE_AI_FOUNDRY_API_KEY
        sync: false
      - key: AZURE_AI_FOUNDRY_DEPLOYMENT
        sync: false            # e.g. gpt-4o
      - key: AZURE_AI_FOUNDRY_API_VERSION
        value: "2024-10-21"

      # ── Azure AI Speech — STT + TTS ────────────────────────────────────────
      - key: AZURE_SPEECH_KEY
        sync: false
      - key: AZURE_SPEECH_REGION
        sync: false            # e.g. centralindia
      - key: AZURE_SPEECH_STT_LANGUAGES
        value: en-IN,te-IN
      - key: AZURE_SPEECH_TTS_VOICE_EN
        value: en-IN-NeerjaNeural
      - key: AZURE_SPEECH_TTS_VOICE_TE
        value: te-IN-ShrutiNeural
      - key: MAX_AUDIO_SECONDS
        value: "30"

      # ── Admin Auth ─────────────────────────────────────────────────────────
      - key: JWT_SECRET
        sync: false            # >= 32 random chars
      - key: JWT_EXPIRE_MINUTES
        value: "60"
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD_HASH
        sync: false            # python -m app.scripts.hash_password

      # ── Rate Limiting ──────────────────────────────────────────────────────
      - key: RATE_LIMIT_ENABLED
        value: "true"
      - key: RATE_LIMIT_PER_MINUTE
        value: "30"
      - key: LOGIN_RATE_LIMIT_PER_MINUTE
        value: "5"
